<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Community page for fans of the Freak Fringe comic book and those who seek an answer to the question; Who is The Figurehead?" />
    <meta name="theme-color" content="#000000" />
    
    <!-- PWA and mobile optimizations -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Font preloads for better performance -->
    <link rel="preload" href="/fonts/comic-neue-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/comic-neue-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/GT-Pressura-Mono-Light.otf" as="font" type="font/opentype" crossorigin>
    
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <title>Freak Fringe</title>
    <style>
      /* Minimal styling for the retro 88x31 badge row */
      footer.site-footer {
        margin-top: 48px;
        padding: 16px 0 32px;
        background: #000;
        color: #bbb;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }
      .badge-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        align-items: center;
        margin: 0 auto 8px;
        max-width: 960px;
      }
      .badge-row a {
        display: inline-block;
        line-height: 0;
      }
      .site-footer small {
        display: block;
        text-align: center;
        font-size: 12px;
        opacity: 0.8;
      }
    </style>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
